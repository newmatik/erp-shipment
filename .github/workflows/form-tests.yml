name: Shipment form tests

on:
  push:
    branches: [version-16]
  pull_request:
    branches: [version-16]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: form-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: node --test .github/scripts/test_shipment_form.cjs
