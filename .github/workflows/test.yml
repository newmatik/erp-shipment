name: test

# Runs every test module under shipment/ against real Frappe and ERPNext, with no
# bench, database or site (#214). Before this, only the tests that import no
# Frappe ran in CI, so a PR could be green while its tests had never run.
#
# The job reads code and nothing else, and it uses no secrets: this repository is
# public. Frappe and ERPNext therefore come from the public upstream repositories,
# and eso-newmatik (private) is replaced by stand-ins for the two functions
# Shipment imports from it; see .github/scripts/run_unit_tests.py.
permissions:
  contents: read

on:
  push:
    branches: [main, dev, version-16]
  pull_request:
    branches: [main, dev, version-16]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    # GitHub-hosted on purpose: this repo is public, so it must not use the
    # self-hosted runner that eso-newmatik picks through vars.LINUX_RUNNER.
    runs-on: ubuntu-latest
    env:
      # The upstream releases production's core forks are built on. eso-newmatik's
      # deploy/production/core-versions.json pins the forks production runs
      # (frappe v16.31.0-newmatik.1, erpnext v16.32.3-newmatik.5); the forks are
      # private and this public repo has no token to read them. Bump these with
      # that file after a core deployment.
      FRAPPE_REF: v16.31.0
      FRAPPE_SHA: 6a329d068416768ec47ccd3326b9cc95a8d7bf99
      ERPNEXT_REF: v16.32.3
      ERPNEXT_SHA: 11e0ba0a1c45f217e2e73e885f699102d06da325
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # frappe v16 declares `requires-python = ">=3.14,<3.15"`, as the bench does.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Clone frappe and erpnext
        run: |
          while read -r app ref sha; do
            git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$ref" \
              "https://github.com/frappe/$app.git" "$RUNNER_TEMP/$app"
            actual=$(git -C "$RUNNER_TEMP/$app" rev-parse HEAD)
            if [ "$actual" != "$sha" ]; then
              echo "::error title=$app $ref moved::frappe/$app $ref is $actual, this workflow pins $sha."
              exit 1
            fi
            echo "$app: frappe/$app $ref ($sha)"
          done <<EOF
          frappe $FRAPPE_REF $FRAPPE_SHA
          erpnext $ERPNEXT_REF $ERPNEXT_SHA
          EOF

      # Editable, as on a bench, so the whole source tree is on the path.
      - name: Install frappe, erpnext and this app
        run: |
          python -m pip install --upgrade pip
          pip install -e "$RUNNER_TEMP/frappe" -e "$RUNNER_TEMP/erpnext" -e .

      - name: Run unit tests
        run: python .github/scripts/run_unit_tests.py
